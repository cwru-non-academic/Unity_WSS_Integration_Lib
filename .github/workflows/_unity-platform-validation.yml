name: WSS candidate platform validation
on:
  workflow_call:
    inputs:
      role: {type: string, required: true}
      wrapper_sha: {type: string, required: true}
      gui_sha: {type: string, required: true}
      fixture_sha: {type: string, required: true}
      sdk: {type: string, required: true}
      tooling_sha: {type: string, required: true}
      candidate_json: {type: string, required: true}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: {required: true}
env:
  WSS_CI_CHANNEL: ${{ github.ref_name }}
  WSS_TARGET_ROOT: ${{ github.workspace }}/wrapper
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
permissions:
  contents: read
jobs:
  platform-compatibility:
    name: Preflight platform compatibility (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, label: Windows}
          - {os: ubuntu-latest, label: Ubuntu}
    steps:
      - uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false
      - name: Reject arbitrary tooling inputs before any tooling execution
        id: tooling_binding
        shell: pwsh
        working-directory: caller
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'Caller checkout differs from actual run.'}
          if($env:ROLE -ceq 'wrapper') {
            if($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/Unity_WSS_Integration_Lib' -or $env:WRAPPER_SHA -cne $env:GITHUB_SHA){throw 'Wrong wrapper tooling caller.'}
            $sha=$env:WRAPPER_SHA
          } else {
            if($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/GUI_Unity_WSS_Application' -or $env:GITHUB_WORKFLOW_REF -cnotmatch '^cwru-non-academic/GUI_Unity_WSS_Application/(\.github/workflows/(?:unity-ci|wss-preflight)\.yml)@'){throw 'Unregistered GUI tooling caller.'}
            $body=Get-Content -LiteralPath $Matches[1] -Raw
            $pins=[regex]::Matches($body,'(?m)^\s*uses: cwru-non-academic/Unity_WSS_Integration_Lib/\.github/workflows/_unity-validation\.yml@([a-f0-9]{40})\s*$')
            if($pins.Count -ne 1){throw 'Exactly one literal reviewed Unity workflow pin is required.'}
            $sha=$pins[0].Groups[1].Value
          }
          if($env:TOOLING_SHA -cne $sha){throw 'Tooling input differs from the literal authenticated caller.'}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.sdk }}
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ inputs.wrapper_sha }}
          path: wrapper
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/GUI_Unity_WSS_Application
          ref: ${{ inputs.gui_sha }}
          path: gui
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ inputs.fixture_sha }}
          path: fixture
          persist-credentials: false
      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content tooling/.github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - name: Resolve the exact producer tuple independently on this host
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tooling/.github/scripts/UnityPromotion.ps1
          $c = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-UnityProducer $c
          ./tooling/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      # Use the locked Core harness, never executable code from the candidate.
      # Check the full extracted universal payload before consumer projection.
      - name: Verify Core universal package rejection fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet build workflow-guard/tools/ArtifactBuild/ArtifactBuild.csproj
          python workflow-guard/tests/Packaging/verify_universal.py "$RUNNER_TEMP/resolved/extracted/WSS-Universal"
      - name: Verify candidate packaging, host transport selection and canonical production commands
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          GUI_SHA: ${{ inputs.gui_sha }}
        run: |
          ./tooling/.github/scripts/Invoke-DotNetPlatformCompatibility.ps1 -ToolRoot "$env:GITHUB_WORKSPACE/tooling" -ToolSha '${{ inputs.tooling_sha }}' -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -WrapperSha $env:WRAPPER_SHA -GuiRoot "$env:GITHUB_WORKSPACE/gui" -GuiSha $env:GUI_SHA -Role $env:ROLE -ConfigPath "$env:GITHUB_WORKSPACE/tooling/.github/unity-ci.json" -OutputRoot "$env:RUNNER_TEMP/platform-results" -Mode candidate -ArtifactRoot "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal" -CandidatePath "$env:RUNNER_TEMP/resolved/candidate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-preflight-platform-${{ inputs.role }}-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/*.json
            ${{ runner.temp }}/platform-results/*.log
            ${{ runner.temp }}/platform-results/conformance/*.json
            ${{ runner.temp }}/platform-results/conformance/*.xml
            ${{ runner.temp }}/platform-results/conformance/*.log

  macos-consumers:
    name: Preflight macOS consumer (${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, label: macOS-x64, cpu: Intel x64, uname: x86_64}
          - {os: macos-15, label: macOS-arm64, cpu: Apple Silicon arm64, uname: arm64}
    steps:
      - name: Require the native Mac runner architecture
        shell: pwsh
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          if (!$IsMacOS -or (& uname -m) -cne $env:EXPECTED_UNAME) { throw 'Native macOS runner architecture mismatch.' }
      - uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false
      - name: Reject arbitrary tooling inputs before any tooling execution
        id: tooling_binding
        shell: pwsh
        working-directory: caller
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'Caller checkout differs from actual run.'}
          if($env:ROLE -ceq 'wrapper') {
            if($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/Unity_WSS_Integration_Lib' -or $env:WRAPPER_SHA -cne $env:GITHUB_SHA){throw 'Wrong wrapper tooling caller.'}
            $sha=$env:WRAPPER_SHA
          } else {
            if($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/GUI_Unity_WSS_Application' -or $env:GITHUB_WORKFLOW_REF -cnotmatch '^cwru-non-academic/GUI_Unity_WSS_Application/(\.github/workflows/(?:unity-ci|wss-preflight)\.yml)@'){throw 'Unregistered GUI tooling caller.'}
            $body=Get-Content -LiteralPath $Matches[1] -Raw
            $pins=[regex]::Matches($body,'(?m)^\s*uses: cwru-non-academic/Unity_WSS_Integration_Lib/\.github/workflows/_unity-validation\.yml@([a-f0-9]{40})\s*$')
            if($pins.Count -ne 1){throw 'Exactly one literal reviewed Unity workflow pin is required.'}
            $sha=$pins[0].Groups[1].Value
          }
          if($env:TOOLING_SHA -cne $sha){throw 'Tooling input differs from the literal authenticated caller.'}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.sdk }}
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ inputs.wrapper_sha }}
          path: wrapper
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/GUI_Unity_WSS_Application
          ref: ${{ inputs.gui_sha }}
          path: gui
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ inputs.fixture_sha }}
          path: fixture
          persist-credentials: false
      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content tooling/.github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - name: Resolve the exact producer tuple independently on this host
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tooling/.github/scripts/UnityPromotion.ps1
          $c = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-UnityProducer $c
          ./tooling/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - name: Verify candidate packaging, host transport selection and canonical production commands
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          GUI_SHA: ${{ inputs.gui_sha }}
        run: |
          ./tooling/.github/scripts/Invoke-DotNetPlatformCompatibility.ps1 -ToolRoot "$env:GITHUB_WORKSPACE/tooling" -ToolSha '${{ inputs.tooling_sha }}' -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -WrapperSha $env:WRAPPER_SHA -GuiRoot "$env:GITHUB_WORKSPACE/gui" -GuiSha $env:GUI_SHA -Role $env:ROLE -ConfigPath "$env:GITHUB_WORKSPACE/tooling/.github/unity-ci.json" -OutputRoot "$env:RUNNER_TEMP/platform-results" -Mode candidate -ArtifactRoot "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal" -CandidatePath "$env:RUNNER_TEMP/resolved/candidate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-preflight-platform-${{ inputs.role }}-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/platform-results/*.json
            ${{ runner.temp }}/platform-results/*.log
            ${{ runner.temp }}/platform-results/conformance/*.json
            ${{ runner.temp }}/platform-results/conformance/*.xml
            ${{ runner.temp }}/platform-results/conformance/*.log

  macos:
    name: Preflight platform compatibility (macOS)
    if: always()
    needs: macos-consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false
      - name: Reject arbitrary tooling inputs before any tooling execution
        id: tooling_binding
        shell: pwsh
        working-directory: caller
        env:
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'Caller checkout differs from actual run.'}
          if($env:ROLE -ceq 'wrapper') {
            if($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/Unity_WSS_Integration_Lib' -or $env:WRAPPER_SHA -cne $env:GITHUB_SHA){throw 'Wrong wrapper tooling caller.'}
            $sha=$env:WRAPPER_SHA
          } else {
            if($env:GITHUB_REPOSITORY -cne 'cwru-non-academic/GUI_Unity_WSS_Application' -or $env:GITHUB_WORKFLOW_REF -cnotmatch '^cwru-non-academic/GUI_Unity_WSS_Application/(\.github/workflows/(?:unity-ci|wss-preflight)\.yml)@'){throw 'Unregistered GUI tooling caller.'}
            $body=Get-Content -LiteralPath $Matches[1] -Raw
            $pins=[regex]::Matches($body,'(?m)^\s*uses: cwru-non-academic/Unity_WSS_Integration_Lib/\.github/workflows/_unity-validation\.yml@([a-f0-9]{40})\s*$')
            if($pins.Count -ne 1){throw 'Exactly one literal reviewed Unity workflow pin is required.'}
            $sha=$pins[0].Groups[1].Value
          }
          if($env:TOOLING_SHA -cne $sha){throw 'Tooling input differs from the literal authenticated caller.'}
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ inputs.tooling_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unity-preflight-platform-${{ inputs.role }}-macOS-x64
          path: ${{ runner.temp }}/macos-evidence/x64
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unity-preflight-platform-${{ inputs.role }}-macOS-arm64
          path: ${{ runner.temp }}/macos-evidence/arm64
      - name: Require Intel and Apple Silicon consumer success
        shell: pwsh
        env:
          MATRIX_RESULT: ${{ needs.macos-consumers.result }}
        run: ./tooling/.github/scripts/Test-MacOSConsumers.ps1 -EvidenceRoot "$env:RUNNER_TEMP/macos-evidence" -MatrixResult $env:MATRIX_RESULT -RequireBackend
