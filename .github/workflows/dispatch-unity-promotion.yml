name: Dispatch GUI Integration promotion
run-name: Dispatch GUI promotion for ${{ github.event.pull_request.merge_commit_sha }}
on:
  pull_request_target:
    types: [closed]
    branches: [dev]
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: unity-dispatch-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false
jobs:
  dispatch:
    name: Dispatch GUI promotion
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'automation/unity-wss-')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep promotion blocked until hosted runtime prerequisites are resolved
        shell: pwsh
        run: throw 'Unity Personal hosted conformance is not provisioned; do not dispatch downstream promotion.'
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
            CSharp_WSS_Integration_Lib
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Validate merged dependency-only PR, provenance and normal CI
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: ./.github/scripts/Dispatch-UnityGui.ps1 -EventPath $env:GITHUB_EVENT_PATH -WorkRoot "$env:RUNNER_TEMP/unity-dispatch" -ValidateOnly
      - name: Mint GUI Actions token after validation
        if: steps.validate.outputs.dispatch_needed == 'true'
        uses: actions/create-github-app-token@v2
        id: dispatch
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: GUI_Unity_WSS_Application
          permission-actions: write
      - name: Dispatch once; inspect any uncertain outcome before retry
        if: steps.validate.outputs.dispatch_needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.dispatch.outputs.token }}
        run: |
          gh api --method POST repos/cwru-non-academic/GUI_Unity_WSS_Application/actions/workflows/promote-integration.yml/dispatches --input "$env:RUNNER_TEMP/unity-dispatch/gui-dispatch.json"
          if ($LASTEXITCODE -ne 0) { throw 'Dispatch failed or uncertain; inspect before replay.' }
