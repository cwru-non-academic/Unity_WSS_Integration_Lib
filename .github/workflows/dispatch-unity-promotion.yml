name: Dispatch GUI Integration promotion
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Resume application promotion / wss-{0}', inputs.producer_run_id) || format('Dispatch GUI promotion for {0}', github.event.pull_request.merge_commit_sha) }}
on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        required: true
        type: string
      barrier_run_id:
        required: true
        type: string
      barrier_attempt:
        required: true
        type: string
      channel: {description: Authorized target channel, required: false, default: dev, type: choice, options: [dev, main]}
  pull_request_target:
    types: [closed]
    branches: [dev, main]
env:
  WSS_CI_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.event.pull_request.base.ref }}
  WSS_TARGET_ROOT: ${{ github.workspace }}
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
  PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: unity-dispatch-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false
jobs:
  dispatch:
    name: Dispatch GUI promotion
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'automation/unity-wss-'))
    runs-on: windows-2022
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require candidate-promotion baseline approval
        shell: pwsh
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-baseline' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              $config = Get-Content .github/unity-ci.json -Raw | ConvertFrom-Json
              if (!$config.baseline_ready) { throw 'Candidate-promotion baseline approval remains pending.' }
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-baseline' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-baseline' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-baseline' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - name: Read locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock=Get-Content .github/scripts/wss-ci.lock.json -Raw|ConvertFrom-Json
          if($lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)"){throw 'Invalid immutable Core guard lock.'}
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: cwru-non-academic/WSSCore
          ref: main
          token: ${{ steps.read.outputs.token }}
          path: .core-stage
          persist-credentials: false
      - name: Require staged integration barrier or verified legacy producer
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BARRIER_RUN_ID: ${{ inputs.barrier_run_id }}
          BARRIER_ATTEMPT: ${{ inputs.barrier_attempt }}
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'resolve-stage' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              ./.github/scripts/Prepare-StagedApplicationFanout.ps1 -Receiver unity -RecordPath .github/unity-candidate.json -WorkRoot "$env:RUNNER_TEMP/gui-stage"
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'resolve-stage' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'resolve-stage' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'resolve-stage' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
      - name: Validate merged dependency-only PR, provenance and normal CI
        if: steps.stage.outputs.dispatch_allowed == 'true'
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          FANOUT_EVENT: ${{ steps.stage.outputs.event_path }}
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-family' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              ./.github/scripts/Dispatch-UnityGui.ps1 -EventPath $env:FANOUT_EVENT -WorkRoot "$env:RUNNER_TEMP/unity-dispatch" -ValidateOnly
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-family' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-family' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'validate-family' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
      - name: Record dispatch intent before application write credentials
        if: steps.validate.outputs.dispatch_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-gui-dispatch-${{ steps.stage.outputs.merge_sha }}
          path: ${{ runner.temp }}/unity-dispatch/gui-dispatch.json
          if-no-files-found: error
          retention-days: 90
      - name: Reverify shared barrier immediately before application write credentials
        if: steps.validate.outputs.dispatch_needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BARRIER_RUN_ID: ${{ inputs.barrier_run_id }}
          BARRIER_ATTEMPT: ${{ inputs.barrier_attempt }}
          EXPECTED_MERGE_SHA: ${{ steps.stage.outputs.merge_sha }}
        run: |
          # WSS diagnostic envelope v1: observational only; absent completion means unknown.
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          try { . ./.github/scripts/wss-ci/PhaseDiagnostics.ps1 } catch { }
          try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'recheck-barrier' -Status 'started' -Boundary -ErrorCode 'none' } catch { }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
          try {
              ./.github/scripts/Prepare-StagedApplicationFanout.ps1 -Receiver unity -RecordPath .github/unity-candidate.json -WorkRoot "$env:RUNNER_TEMP/gui-stage-recheck" -ExpectedMergeSha $env:EXPECTED_MERGE_SHA
          } catch {
              $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'recheck-barrier' -Status 'failed' -Boundary -ErrorCode 'terminating-error' } catch { }
              if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
              throw
          }
          $wssDiagnosticExit = Get-Variable LASTEXITCODE -ValueOnly -ErrorAction SilentlyContinue
          if ($null -ne $wssDiagnosticExit -and $wssDiagnosticExit -ne 0) {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'recheck-barrier' -Status 'failed' -Boundary -ErrorCode 'native-nonzero' } catch { }
          } else {
              try { Write-WssCiPhaseDiagnostic -Family 'unity' -Role 'gui' -Operation 'recheck-barrier' -Status 'completed' -Boundary -ErrorCode 'none' } catch { }
          }
          if ($null -ne $wssDiagnosticExit) { $global:LASTEXITCODE = $wssDiagnosticExit }
      - name: Mint GUI Actions token after validation
        if: steps.validate.outputs.dispatch_needed == 'true'
        uses: actions/create-github-app-token@v2
        id: dispatch
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: GUI_Unity_WSS_Application
          permission-actions: write
      - name: Dispatch once; inspect any uncertain outcome before retry
        if: steps.validate.outputs.dispatch_needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.dispatch.outputs.token }}
          UNITY_DISPATCH_READ_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          . ./.github/scripts/UnityPromotion.ps1
          Send-UnityGuiDispatch "$env:RUNNER_TEMP/unity-dispatch/gui-dispatch.json" $env:UNITY_DISPATCH_READ_TOKEN $env:GH_TOKEN
