name: WSS conformance validation
on:
  workflow_call:
    inputs:
      role: {type: string, required: true}
      mode: {type: string, required: true}
      wrapper_sha: {type: string, default: ''}
      gui_sha: {type: string, default: ''}
      candidate_json: {type: string, default: ''}
    secrets:
      WSS_GITHUB_APP_PRIVATE_KEY: {required: false}
permissions:
  contents: read
jobs:
  prerequisites:
    name: Resolve preflight inputs
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed on unpublished baseline or unsupported hosted Personal activation
        shell: pwsh
        run: |
          $config = Get-Content .github/unity-ci.json -Raw | ConvertFrom-Json
          $missing = @()
          if (!$config.baseline_ready) { $missing += 'Review the preserved dev baseline, merge workflow definitions to the default branch and pin the accepted harness.' }
          if ($config.gui_harness_sha -cnotmatch '^[0-9a-f]{40}$') { $missing += 'Pin the published GUI harness source SHA.' }
          $missing += 'Unity Personal: no supported unattended GitHub-hosted activation route has been verified or implemented. Hub-activated local EditMode remains available. Do not export/copy activation material or substitute Pro serial activation.'
          throw ($missing -join "\n")
  conformance:
    needs: prerequisites
    name: ${{ inputs.role == 'wrapper' && (inputs.mode == 'candidate' && 'Preflight compatibility (Windows)' || 'Integration compatibility (Windows)') || 'GUI platform compatibility (Windows)' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Validate immutable inputs
        shell: pwsh
        env:
          ROLE: ${{ inputs.role }}
          MODE: ${{ inputs.mode }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          GUI_SHA: ${{ inputs.gui_sha }}
        run: |
          if ($env:ROLE -cnotin @('wrapper','gui') -or $env:MODE -cnotin @('candidate','committed')) { throw 'Invalid validation role/mode.' }
          if ($env:MODE -ceq 'candidate') {
            if ($env:GITHUB_REF -cne 'refs/heads/dev' -or $env:WRAPPER_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:GUI_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Candidate preflight requires exact dev source SHAs.' }
            $ownSha = if ($env:ROLE -ceq 'wrapper') { $env:WRAPPER_SHA } else { $env:GUI_SHA }
            if ($ownSha -cne $env:GITHUB_SHA) { throw 'Source raced during dispatch.' }
          }
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
            CSharp_WSS_Integration_Lib
          permission-contents: read
          permission-actions: read
      - name: Check out trusted Unity tooling
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: dev
          path: trusted
          token: ${{ steps.read.outputs.token }}
          persist-credentials: false
      - name: Resolve exact source and fixture revisions
        id: sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          GUI_SHA: ${{ inputs.gui_sha }}
        run: |
          . ./trusted/.github/scripts/UnityContract.ps1
          $config = Read-UnityConfig ./trusted/.github/unity-ci.json
          $gui = $env:GUI_SHA
          $wrapper = $env:WRAPPER_SHA
          if (!$gui) { $gui = $config.gui_harness_sha }
          Assert-UnitySha $gui
          if (!$wrapper) {
            $link = Invoke-UnityGh @('api',"repos/$UnityGuiRepository/contents/$($UnityGitlink)?ref=$gui") | ConvertFrom-Json
            $wrapper = $link.sha
          }
          Assert-UnitySha $wrapper
          "gui=$gui" >> $env:GITHUB_OUTPUT
          "wrapper=$wrapper" >> $env:GITHUB_OUTPUT
          "fixture=$($config.fixture_commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/GUI_Unity_WSS_Application
          ref: ${{ steps.sources.outputs.gui }}
          path: gui
          lfs: true
          token: ${{ steps.read.outputs.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.wrapper }}
          path: wrapper
          lfs: true
          token: ${{ steps.read.outputs.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.fixture }}
          path: fixture
          token: ${{ steps.read.outputs.token }}
          persist-credentials: false
      - name: Require approved licensed Editor provisioning
        shell: pwsh
        run: ./trusted/.github/scripts/Assert-UnityPrerequisites.ps1 -ConfigPath ./trusted/.github/unity-ci.json
      - name: Resolve exact producer candidate
        if: inputs.mode == 'candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./trusted/.github/scripts/UnityPromotion.ps1
          $c = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-UnityProducer $c
          ./trusted/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - name: Execute canonical cases in real Unity
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          ROLE: ${{ inputs.role }}
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
          GUI_SHA: ${{ steps.sources.outputs.gui }}
          WSS_UNITY_EDITOR_PATH: ${{ vars.WSS_UNITY_EDITOR_PATH }}
        run: |
          $options = @{
            GuiRoot = "$env:GITHUB_WORKSPACE/gui"
            WrapperRoot = "$env:GITHUB_WORKSPACE/wrapper"
            FixtureRoot = "$env:GITHUB_WORKSPACE/fixture"
            GuiSha = $env:GUI_SHA
            WrapperSha = $env:WRAPPER_SHA
            ConfigPath = "$env:GITHUB_WORKSPACE/trusted/.github/unity-ci.json"
            UnityExe = $env:WSS_UNITY_EDITOR_PATH
            OutputRoot = "$env:RUNNER_TEMP/unity-results"
            Mode = $env:MODE
            Role = $env:ROLE
          }
          if ($env:MODE -ceq 'candidate') {
            $options.ArtifactRoot = "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal"
            $options.CandidatePath = "$env:RUNNER_TEMP/resolved/candidate.json"
          }
          ./trusted/.github/scripts/Invoke-UnityConformance.ps1 @options
      - uses: actions/upload-artifact@v4
        if: success() && inputs.mode == 'candidate'
        with:
          name: unity-preflight-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/unity-results/evidence.json
            ${{ runner.temp }}/unity-results/results.xml
            ${{ runner.temp }}/unity-results/unity.log
            ${{ runner.temp }}/unity-results/projection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/unity-results/*.log
            ${{ runner.temp }}/unity-results/*.xml
            ${{ runner.temp }}/unity-results/harness/conformance-inputs.json
