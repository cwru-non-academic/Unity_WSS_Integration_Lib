# INACTIVE REVIEW FRAGMENT, not a GitHub Actions workflow.
# Merge these steps only after the adoption checklist is satisfied.
# Existing prerequisite source/runtime/readiness gates run BEFORE selection.
prerequisite_outputs:
  selection_id: ${{ steps.select_tests.outputs.selection_id }}
  test_repository: ${{ steps.select_tests.outputs.test_repository }}
  test_commit: ${{ steps.select_tests.outputs.test_commit }}
  target_id: ${{ steps.select_tests.outputs.target_id }}
prerequisite_steps:
  # workflow-guard is checked out using validated immutable wss-ci.lock.json.
  # Use the coordinated published Core lock; never a floating ref or local SHA.
  - uses: actions/setup-node@v4
    with:
      node-version: '24'
  - name: Freeze selected test source once for this workflow
    id: select_tests
    shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }} # Replace only with existing contents/actions-read token when required.
      WSS_USE_PIN_TESTS: ${{ vars.WSS_USE_PIN_TESTS }}
      WSS_PIN_TEST_REPOSITORY: ${{ vars.WSS_PIN_TEST_REPOSITORY }}
      WSS_PIN_TEST_COMMIT: ${{ vars.WSS_PIN_TEST_COMMIT }}
      ROLE: ${{ inputs.role }}
      MODE: ${{ inputs.mode }}
      CANDIDATE_JSON: ${{ inputs.candidate_json }}
    run: |
      $target = if ($env:ROLE -ceq 'gui') { 'unity-gui' } else { 'unity-wrapper' }
      $candidate = '-'
      if ($env:MODE -ceq 'candidate') {
        $candidate = "$env:RUNNER_TEMP/selection-candidate.json"
        $env:CANDIDATE_JSON | Set-Content $candidate
      } else {
        # Use the exact installed producer tuple, when present, to reuse a
        # current producer's campaign selection instead of resolving latest.
        $candidate = 'wrapper/.github/unity-candidate.json'
      }
      node workflow-guard/tools/ci/ci-test-selection.mjs select $target $candidate "$env:RUNNER_TEMP/test-selection" $env:MODE
      if ($LASTEXITCODE) { throw 'Test selection failed.' }
  - uses: actions/upload-artifact@v4
    with:
      name: wss-selected-tests-${{ steps.select_tests.outputs.target_id }}-a${{ github.run_attempt }}
      path: ${{ runner.temp }}/test-selection/context.json
      if-no-files-found: error
      retention-days: 14
suite_steps:
  # Fixed product wrapper/gui/fixture + locked Core checkouts remain unchanged.
  - uses: actions/download-artifact@v4
    with:
      name: wss-selected-tests-${{ needs.prerequisites.outputs.target_id }}-a${{ github.run_attempt }}
      path: ${{ runner.temp }}/test-selection
  - uses: actions/checkout@v4
    with:
      repository: ${{ needs.prerequisites.outputs.test_repository }}
      ref: ${{ needs.prerequisites.outputs.test_commit }}
      path: selected-tests
      persist-credentials: false
  - name: Verify frozen selection, run mandatory and selected suites, bind evidence
    shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }} # Read-only. Never give selected suites write credentials.
      WSS_TEST_SELECTION_ID: ${{ needs.prerequisites.outputs.selection_id }}
      TARGET_ID: ${{ needs.prerequisites.outputs.target_id }}
      WRAPPER_SHA: ${{ needs.prerequisites.outputs.wrapper }}
      GUI_SHA: ${{ needs.prerequisites.outputs.gui }}
      MODE: ${{ inputs.mode }}
    run: |
      $options = @{
        TargetId=$env:TARGET_ID; ContextPath="$env:RUNNER_TEMP/test-selection/context.json"
        CoreToolsRoot="$env:GITHUB_WORKSPACE/workflow-guard"; TestRoot="$env:GITHUB_WORKSPACE/selected-tests"
        WrapperRoot="$env:GITHUB_WORKSPACE/wrapper"; WrapperSha=$env:WRAPPER_SHA
        FixtureRoot="$env:GITHUB_WORKSPACE/fixture"; ConfigPath="$env:GITHUB_WORKSPACE/wrapper/.github/unity-ci.json"
        OutputRoot="$env:RUNNER_TEMP/selected-suite"; BindingOutputRoot="$env:RUNNER_TEMP/selected-binding"; Mode=$env:MODE
      }
      if ($env:GUI_SHA) { $options.GuiRoot="$env:GITHUB_WORKSPACE/gui"; $options.GuiSha=$env:GUI_SHA }
      if ($env:MODE -ceq 'candidate') {
        # Resolver remains trusted and runs before this step. No selected release validator.
        $options.ArtifactRoot="$env:RUNNER_TEMP/resolved/extracted/WSS-Universal"
        $options.CandidatePath="$env:RUNNER_TEMP/resolved/candidate.json"
      }
      ./wrapper/.github/scripts/Invoke-SelectedUnityTests.ps1 @options
  - uses: actions/upload-artifact@v4
    if: always()
    with:
      # Add existing matrix label to this evidence artifact when used on platform matrices.
      name: selected-suite-${{ needs.prerequisites.outputs.target_id }}-${{ runner.os }}-a${{ github.run_attempt }}
      if-no-files-found: error
      path: |
        ${{ runner.temp }}/selected-binding/*.json
        ${{ runner.temp }}/selected-suite/**/*.json
        ${{ runner.temp }}/selected-suite/**/*.xml
        ${{ runner.temp }}/selected-suite/**/*.log
