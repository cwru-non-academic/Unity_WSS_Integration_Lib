name: Dispatch GUI Integration promotion
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Resume application promotion / wss-{0}', inputs.producer_run_id) || format('Dispatch GUI promotion for {0}', github.event.pull_request.merge_commit_sha) }}
on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        required: true
        type: string
      barrier_run_id:
        required: true
        type: string
      barrier_attempt:
        required: true
        type: string
  pull_request_target:
    types: [closed]
    branches: [dev]
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: unity-dispatch-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false
jobs:
  dispatch:
    name: Dispatch GUI promotion
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'automation/unity-wss-'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require candidate-promotion baseline approval
        shell: pwsh
        run: |
          $config = Get-Content .github/unity-ci.json -Raw | ConvertFrom-Json
          if (!$config.baseline_ready) { throw 'Candidate-promotion baseline approval remains pending.' }
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: |
            WSSCore
            Unity_WSS_Integration_Lib
            GUI_Unity_WSS_Application
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: cwru-non-academic/WSSCore
          ref: main
          token: ${{ steps.read.outputs.token }}
          path: .core-stage
          persist-credentials: false
      - name: Require staged integration barrier or verified legacy producer
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          BARRIER_RUN_ID: ${{ inputs.barrier_run_id }}
          BARRIER_ATTEMPT: ${{ inputs.barrier_attempt }}
        run: ./.github/scripts/Prepare-StagedApplicationFanout.ps1 -Receiver unity -RecordPath .github/unity-candidate.json -WorkRoot "$env:RUNNER_TEMP/gui-stage"
      - name: Validate merged dependency-only PR, provenance and normal CI
        if: steps.stage.outputs.dispatch_allowed == 'true'
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          FANOUT_EVENT: ${{ steps.stage.outputs.event_path }}
        run: ./.github/scripts/Dispatch-UnityGui.ps1 -EventPath $env:FANOUT_EVENT -WorkRoot "$env:RUNNER_TEMP/unity-dispatch" -ValidateOnly
      - name: Mint GUI Actions token after validation
        if: steps.validate.outputs.dispatch_needed == 'true'
        uses: actions/create-github-app-token@v2
        id: dispatch
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: GUI_Unity_WSS_Application
          permission-actions: write
      - name: Dispatch once; inspect any uncertain outcome before retry
        if: steps.validate.outputs.dispatch_needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.dispatch.outputs.token }}
        run: |
          gh api --method POST repos/cwru-non-academic/GUI_Unity_WSS_Application/actions/workflows/promote-integration.yml/dispatches --input "$env:RUNNER_TEMP/unity-dispatch/gui-dispatch.json"
          if ($LASTEXITCODE -ne 0) { throw 'Dispatch failed or uncertain; inspect before replay.' }
