name: Selected test source contracts
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    name: Selected test source contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - name: Verify selected suite credential isolation
        shell: pwsh
        run: |
          ./.github/scripts/tests/SelectedProcessIsolation.Tests.ps1
          ./.github/scripts/tests/UnityTooling.Tests.ps1
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: 8fbdead36cf9c5a31ed415d56cb5dbdfa552b889
          path: .legacy-product
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Unity_WSS_Integration_Lib
          ref: b7c9d0374fec7cfecfa783f76a899ab0cff077c4
          path: .modern-product
          lfs: true
          persist-credentials: false
      - name: Verify immutable payload profile boundaries without executing payloads
        shell: pwsh
        run: ./.github/scripts/tests/UnityProfiles.Tests.ps1 -MainRoot "$env:GITHUB_WORKSPACE/.legacy-product" -DevRoot "$env:GITHUB_WORKSPACE/.modern-product"
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: 7145e2307f997f703748530bf74311ef94455e98
          path: .legacy-fixture
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.316
      - name: Preserve the complete historical baseline with new trusted tooling
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          # Synthetic runner regression, never frozen campaign acceptance evidence.
          $legacy=Join-Path $env:GITHUB_WORKSPACE '.legacy-product'
          Copy-Item .github/scripts/* "$legacy/.github/scripts" -Recurse -Force
          Copy-Item .github/unity-ci.json "$legacy/.github/unity-ci.json" -Force
          Copy-Item Conformance~/Prepare-Harness.ps1 "$legacy/Conformance~/Prepare-Harness.ps1" -Force
          git -C $legacy -c user.name='Runner regression' -c user.email='runner@example.invalid' add .github/scripts .github/unity-ci.json Conformance~/Prepare-Harness.ps1
          git -C $legacy -c user.name='Runner regression' -c user.email='runner@example.invalid' commit -m 'Synthetic tooling regression only'
          if($LASTEXITCODE){throw 'Cannot prepare isolated legacy regression source.'}
          $sha=(git -C $legacy rev-parse HEAD).Trim()
          & "$legacy/.github/scripts/Invoke-DotNetPlatformCompatibility.ps1" -WrapperRoot $legacy -WrapperSha $sha -FixtureRoot "$env:GITHUB_WORKSPACE/.legacy-fixture" -ConfigPath "$legacy/.github/unity-ci.json" -OutputRoot "$env:RUNNER_TEMP/legacy-profile-regression"
